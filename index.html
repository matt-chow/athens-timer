<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#c79583">
  <meta name="description" content="A quiet visual timer beneath the changing skies of Ancient Athens.">
  <title>Ancient Athens Visual Timer</title>
  <style>
    :root {
      color-scheme: light;
      --sky-top: #bc8394;
      --sky-middle: #e9aa88;
      --sky-bottom: #f4d1a2;
      --ink: #493f49;
      --muted-ink: #685762;
      --night-opacity: 0;
      --torch-opacity: 0;
      --window-opacity: 0;
      --cloud-color: #fff0d7;
      --cloud-opacity: .24;
      --scene-dim: 0;
    }

    * { box-sizing: border-box; }

    html, body { width: 100%; min-height: 100%; margin: 0; }

    body {
      overflow: hidden;
      background: #bc8394;
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button, input { font: inherit; }
    button { -webkit-tap-highlight-color: transparent; }

    .app {
      position: relative;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      isolation: isolate;
      overflow: hidden;
    }

    .sky {
      position: absolute;
      inset: -2%;
      z-index: -3;
      background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-middle) 56%, var(--sky-bottom) 100%);
      transform-origin: 50% 50%;
      will-change: transform, filter;
    }

    .sky.breathing { animation: breathe 4s ease-in-out infinite; }
    @keyframes breathe {
      0%, 100% { transform: scale(1); opacity: 1; filter: brightness(1); }
      50% { transform: scale(1.025); opacity: .96; filter: brightness(1.055); }
    }

    .scene {
      position: absolute;
      inset: 0;
      z-index: -2;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .scene-dimmer {
      position: absolute;
      inset: 0;
      z-index: -1;
      background: #17233f;
      opacity: var(--scene-dim);
      pointer-events: none;
    }

    .starfield { opacity: var(--night-opacity); transform-origin: 50% 45%; }
    .app.paused .starfield { animation: star-breathe 4s ease-in-out infinite; }
    @keyframes star-breathe { 0%, 100% { opacity: var(--night-opacity); transform: scale(1); } 50% { opacity: calc(var(--night-opacity) * .74); transform: scale(1.012); } }
    .star { animation: twinkle var(--twinkle, 3.5s) ease-in-out infinite alternate; animation-delay: var(--delay, 0s); }
    @keyframes twinkle { from { opacity: .18; } to { opacity: .88; } }

    .clouds { fill: var(--cloud-color); opacity: var(--cloud-opacity); transition: fill 1.2s ease, opacity 1.2s ease; }
    .cloud-band { transform-box: view-box; animation: cloud-drift var(--drift, 90s) linear infinite; }
    .cloud-band.slow { --drift: 132s; animation-delay: -47s; }
    .cloud-band.near { --drift: 74s; animation-delay: -29s; }
    @keyframes cloud-drift { from { transform: translateX(-220px); } to { transform: translateX(280px); } }
    .app.paused .clouds { animation: cloud-breathe 4s ease-in-out infinite; }
    .app.paused .cloud-band { animation-play-state: paused; }
    @keyframes cloud-breathe { 0%, 100% { opacity: var(--cloud-opacity); } 50% { opacity: calc(var(--cloud-opacity) * .68); } }

    .shooting-stars { opacity: var(--night-opacity); }
    .shooting-star { opacity: 0; }
    .shooting-star.active { animation: shoot 1.35s cubic-bezier(.2,.5,.35,1) 1; }
    @keyframes shoot {
      0% { opacity: 0; transform: translate(-20px, -10px); }
      12% { opacity: .8; }
      100% { opacity: 0; transform: translate(210px, 90px); }
    }

    .torchlight { opacity: var(--torch-opacity); }
    .window-light {
      opacity: var(--window-opacity);
      fill: #ffd889;
      filter: drop-shadow(0 0 4px rgba(255, 185, 83, .95));
      transition: opacity .9s ease;
    }
    .flame { transform-box: fill-box; transform-origin: center bottom; animation: flame 2.1s ease-in-out infinite alternate; }
    .flame:nth-child(2n) { animation-duration: 2.8s; animation-delay: -.9s; }
    @keyframes flame { from { opacity: .6; transform: scale(.82, .9); } to { opacity: 1; transform: scale(1.12, 1.16); } }

    .vignette {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(ellipse at 50% 46%, transparent 38%, rgba(48, 33, 49, .14) 100%);
    }

    .topbar {
      position: absolute;
      top: max(27px, env(safe-area-inset-top));
      left: clamp(24px, 4.5vw, 72px);
      right: clamp(24px, 4.5vw, 72px);
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 20px;
      transition: opacity .65s ease, transform .65s ease;
    }

    .brand { display: flex; align-items: center; gap: 13px; }
    .brand-mark { width: 36px; height: 36px; flex: none; opacity: .78; }
    .brand-name { font-size: 13px; font-weight: 650; letter-spacing: .19em; text-transform: uppercase; line-height: 1.45; }
    .brand-sub { margin-top: 3px; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; opacity: .65; }
    .top-note { padding-top: 4px; font-size: 12px; font-weight: 600; letter-spacing: .2em; text-transform: uppercase; opacity: .7; text-align: right; }

    .timer-panel {
      position: absolute;
      top: clamp(106px, 17.5vh, 190px);
      left: 50%;
      transform: translateX(-50%);
      width: min(92vw, 680px);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      filter: drop-shadow(0 2px 20px rgba(255, 235, 205, .25));
      transition: opacity .65s ease, transform .65s ease;
    }

    .eyebrow { font-size: 12px; font-weight: 680; letter-spacing: .34em; text-transform: uppercase; opacity: .68; }
    .time-row { display: flex; align-items: center; justify-content: center; margin-top: 5px; font-variant-numeric: tabular-nums; }
    .time-field {
      width: 2.18ch;
      min-width: 0;
      padding: 0;
      border: 0;
      outline: none;
      border-radius: 9px;
      background: transparent;
      color: inherit;
      text-align: center;
      font-size: clamp(74px, 10vw, 151px);
      font-weight: 240;
      letter-spacing: -.09em;
      line-height: 1.12;
      appearance: none;
      caret-color: currentColor;
    }
    .time-field:focus-visible { background: rgba(255, 250, 239, .18); box-shadow: 0 0 0 2px rgba(255, 248, 230, .65); }
    .colon { position: relative; top: -.065em; padding: 0 .04em .04em .01em; font-size: clamp(66px, 9vw, 132px); font-weight: 200; line-height: 1; opacity: .72; }
    .timer-caption { margin-top: 1px; font-size: 12px; font-weight: 550; letter-spacing: .23em; text-transform: uppercase; opacity: .68; }

    .bottom-ui {
      position: absolute;
      left: 50%;
      bottom: max(30px, calc(env(safe-area-inset-bottom) + 20px));
      transform: translateX(-50%);
      width: min(440px, calc(100vw - 32px));
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      transition: opacity .65s ease, transform .65s ease;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px;
      border: 1px solid rgba(255, 251, 241, .56);
      border-radius: 999px;
      background: rgba(251, 241, 223, .73);
      box-shadow: 0 12px 42px rgba(60, 45, 52, .14), inset 0 1px rgba(255, 255, 255, .45);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }
    .control {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 50%;
      color: #514c50;
      background: transparent;
      cursor: pointer;
      transition: transform .2s ease, background .2s ease, box-shadow .2s ease;
    }
    .control:hover { background: rgba(255, 255, 255, .5); transform: translateY(-1px); }
    .control:focus-visible { outline: 2px solid #68516c; outline-offset: 2px; }
    .control:active { transform: scale(.94); }
    .control svg { width: 18px; height: 18px; stroke-width: 1.8; }
    .control svg[hidden] { display: none; }
    .control.primary { width: 52px; height: 52px; color: #fbf2e4; background: #5b5658; box-shadow: 0 4px 12px rgba(50, 44, 50, .22); }
    .control.primary:hover { background: #47454e; }
    .control.primary svg { width: 19px; height: 19px; }
    .divider { width: 1px; height: 22px; margin: 0 3px; background: rgba(75, 70, 76, .16); }
    .bottom-note { color: var(--muted-ink); font-size: 12px; font-weight: 600; letter-spacing: .22em; text-transform: uppercase; text-shadow: 0 1px 10px rgba(255, 245, 228, .7); }

    .ui-hidden .topbar { opacity: 0; transform: translateY(-10px); pointer-events: none; }
    .ui-hidden .timer-panel { opacity: 0; transform: translate(-50%, -8px); pointer-events: none; }
    .ui-hidden .bottom-ui { opacity: 0; transform: translate(-50%, 12px); pointer-events: none; }

    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }

    @media (max-width: 640px) {
      .topbar { top: max(21px, env(safe-area-inset-top)); left: 22px; right: 22px; }
      .brand-mark { width: 29px; height: 29px; }
      .brand-name { font-size: 12px; letter-spacing: .14em; }
      .brand-sub, .top-note { font-size: 11px; }
      .timer-panel { top: clamp(115px, 20vh, 185px); }
      .time-field { font-size: clamp(69px, 16vw, 108px); }
      .colon { font-size: clamp(62px, 14vw, 98px); }
      .bottom-note { font-size: 11px; }
    }

    @media (max-height: 570px) {
      .timer-panel { top: 73px; }
      .time-field { font-size: clamp(58px, 12vh, 84px); }
      .colon { font-size: clamp(54px, 11vh, 78px); }
      .bottom-ui { bottom: max(13px, env(safe-area-inset-bottom)); gap: 6px; }
      .bottom-note { display: none; }
      .topbar { top: 16px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>

    <div class="sky" id="sky" aria-hidden="true"></div>

        <linearGradient id="dirtRoad" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#d19a69"/><stop offset=".5" stop-color="#b47a59"/><stop offset="1" stop-color="#8f6255"/></linearGradient>
        <pattern id="earthTexture" width="34" height="24" patternUnits="userSpaceOnUse"><rect width="34" height="24" fill="transparent"/><circle cx="5" cy="7" r="1.3" fill="#714f48" opacity=".3"/><circle cx="21" cy="4" r=".8" fill="#efd09e" opacity=".25"/><path d="M11 18l5-2m10 5l4-3" stroke="#5e4b47" stroke-width="1" opacity=".22"/></pattern>
        <radialGradient id="sunGlow"><stop stop-color="#fff7c9" stop-opacity=".62"/><stop offset=".36" stop-color="#fff0b7" stop-opacity=".2"/><stop offset="1" stop-color="#fff0b7" stop-opacity="0"/></radialGradient>
        <radialGradient id="torchGlow"><stop stop-color="#ffdc89" stop-opacity=".8"/><stop offset=".23" stop-color="#ffc66f" stop-opacity=".34"/><stop offset="1" stop-color="#ffbd65" stop-opacity="0"/></radialGradient>

        <mask id="crescent"><rect x="-40" y="-40" width="80" height="80" fill="white"/><circle cx="12" cy="-9" r="24" fill="black"/></mask>
        <g id="oliveTree">

    (() => {
      'use strict';

      const $ = (id) => document.getElementById(id);
      const app = $('app');
      const sky = $('sky');
      const minutesInput = $('minutes');
      const secondsInput = $('seconds');
      const playButton = $('play');
      const resetButton = $('reset');
      const fullscreenButton = $('fullscreen');
      const periodLabel = $('period-label');
      const caption = $('timer-caption');
      const eyebrow = $('timer-eyebrow');
      const announcement = $('announcement');
      const sunCelestial = $('sun-celestial');
      const moonCelestial = $('moon-celestial');
      const rootStyle = document.documentElement.style;

      const initialDuration = 25 * 60 * 1000;
      let durationMs = initialDuration;
      let remainingMs = initialDuration;
      let deadline = 0;
      let running = false;
      let completed = false;
      let tickInterval = null;
      let hideTimeout = null;
      let audioContext = null;
      let editingChanged = false;
      let nextShootingStarAt = Infinity;
      let shootingStarIndex = 0;

      const palette = [
        { p: 0, top: [22, 29, 58], middle: [49, 55, 86], bottom: [96, 83, 101], ink: [244, 231, 211], muted: [222, 211, 201] },
        { p: .33, top: [62, 49, 86], middle: [137, 72, 92], bottom: [218, 124, 91], ink: [248, 232, 214], muted: [235, 213, 198] },
        { p: .66, top: [86, 167, 186], middle: [127, 194, 200], bottom: [233, 199, 151], ink: [55, 66, 72], muted: [78, 86, 87] },
        { p: 1, top: [121, 139, 158], middle: [213, 145, 116], bottom: [248, 190, 115], ink: [69, 61, 67], muted: [96, 79, 82] }
      ];

      const clamp = (value, min, max) => Math.min(max, Math.max(min, value));
      const mix = (a, b, t) => a.map((value, i) => Math.round(value + (b[i] - value) * t));
      const rgb = (values) => `rgb(${values.join(' ')})`;
      const smooth = (t) => t * t * (3 - 2 * t);

      function colorAt(progress) {
        for (let i = 0; i < palette.length - 1; i++) {
          const a = palette[i];
          const b = palette[i + 1];
          if (progress <= b.p) {
            const t = smooth(clamp((progress - a.p) / (b.p - a.p), 0, 1));
            return { top: mix(a.top, b.top, t), middle: mix(a.middle, b.middle, t), bottom: mix(a.bottom, b.bottom, t), ink: mix(a.ink, b.ink, t), muted: mix(a.muted, b.muted, t) };
          }
        }
        return palette[palette.length - 1];
      }

      function renderAtmosphere() {
        const progress = durationMs > 0 ? clamp(remainingMs / durationMs, 0, 1) : 1;
        const colors = colorAt(progress);
        rootStyle.setProperty('--sky-top', rgb(colors.top));
        rootStyle.setProperty('--sky-middle', rgb(colors.middle));
        rootStyle.setProperty('--sky-bottom', rgb(colors.bottom));
        rootStyle.setProperty('--ink', rgb(colors.ink));
        rootStyle.setProperty('--muted-ink', rgb(colors.muted));

        let cloudColor = mix([94, 87, 125], [252, 244, 220], smooth(clamp(progress / .66, 0, 1)));
        if (progress > .78) cloudColor = mix(cloudColor, [255, 220, 178], smooth((progress - .78) / .22));
        rootStyle.setProperty('--cloud-color', rgb(cloudColor));
        rootStyle.setProperty('--cloud-opacity', (.1 + .17 * smooth(clamp(progress / .5, 0, 1))).toFixed(3));

        const night = smooth(clamp((.36 - progress) / .28, 0, 1));
        rootStyle.setProperty('--night-opacity', night.toFixed(3));
        rootStyle.setProperty('--torch-opacity', smooth(clamp((1 / 3 - progress) / .22, 0, 1)).toFixed(3));
        rootStyle.setProperty('--window-opacity', smooth(clamp((1 / 3 - progress) / .14, 0, 1)).toFixed(3));
        rootStyle.setProperty('--scene-dim', (night * .18).toFixed(3));

        const sunPhase = progress >= .66
          ? clamp(((1 - progress) / .34) * .5, 0, .5)
          : clamp(.5 + ((.66 - progress) / .33) * .5, .5, 1);
        const sunX = 120 + 1200 * sunPhase;
        const sunY = 500 - 425 * Math.sin(Math.PI * sunPhase);
        sunCelestial.setAttribute('transform', `translate(${sunX.toFixed(2)} ${sunY.toFixed(2)})`);
        sunCelestial.setAttribute('opacity', smooth(clamp((progress - .33) / .025, 0, 1)).toFixed(3));

        const moonPhase = clamp((.33 - progress) / .33, 0, 1);
        const moonX = 120 + 600 * moonPhase;
        const moonY = 500 - 410 * Math.sin(Math.PI * .5 * moonPhase);
        moonCelestial.setAttribute('transform', `translate(${moonX.toFixed(2)} ${moonY.toFixed(2)})`);
        moonCelestial.setAttribute('opacity', smooth(clamp((.34 - progress) / .025, 0, 1)).toFixed(3));

        periodLabel.textContent = progress > .82 ? 'Deep dawn' : progress > .49 ? 'High Attic day' : progress > .33 ? 'Violet dusk' : 'The quiet night';
      }

      function renderTime() {
        const totalSeconds = Math.ceil(remainingMs / 1000);
        const minutes = Math.floor(totalSeconds / 60);
        const seconds = totalSeconds % 60;
        if (document.activeElement !== minutesInput) minutesInput.value = String(minutes).padStart(2, '0');
        if (document.activeElement !== secondsInput) secondsInput.value = String(seconds).padStart(2, '0');
        document.title = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')} · Ancient Athens Visual Timer`;
        renderAtmosphere();
      }

      function updateControls() {
        $('play-icon').toggleAttribute('hidden', running);
        $('pause-icon').toggleAttribute('hidden', !running);
        playButton.setAttribute('aria-label', running ? 'Pause timer' : 'Start timer');
        playButton.title = running ? 'Pause timer' : 'Start timer';
        sky.classList.toggle('breathing', !running && remainingMs > 0 && remainingMs < durationMs);
        app.classList.toggle('paused', !running && remainingMs > 0 && remainingMs < durationMs);
        caption.textContent = completed ? 'Your moment is complete' : running ? 'Breathe with the passing light' : remainingMs < durationMs ? 'Take a breath, then continue' : 'Set your time, then settle in';
        eyebrow.textContent = completed ? 'A moment well spent' : 'A moment to be here';
      }

      function showControls() {
        app.classList.remove('ui-hidden');
        clearTimeout(hideTimeout);
        if (running && document.activeElement !== minutesInput && document.activeElement !== secondsInput) {
          hideTimeout = setTimeout(() => app.classList.add('ui-hidden'), 3000);
        }
      }

      function stopClock() {
        running = false;
        clearInterval(tickInterval);
        tickInterval = null;
        clearTimeout(hideTimeout);
        app.classList.remove('ui-hidden');
      }

      function finish() {
        if (completed) return;
        stopClock();
        remainingMs = 0;
        completed = true;
        renderTime();
        updateControls();
        announcement.textContent = 'Timer complete.';
        playChime();
      }

      function tick() {
        if (!running) return;
        remainingMs = Math.max(0, deadline - performance.now());
        if (remainingMs === 0) finish();
        else {
          renderTime();
          const progress = durationMs > 0 ? remainingMs / durationMs : 1;
          if (progress < 1 / 3) {
            if (!Number.isFinite(nextShootingStarAt)) nextShootingStarAt = performance.now() + 9000 + Math.random() * 17000;
            if (performance.now() >= nextShootingStarAt) {
              const star = $(shootingStarIndex++ % 2 ? 'shooting-star-b' : 'shooting-star-a');
              star.classList.remove('active');
              setTimeout(() => star.classList.add('active'), 20);
              setTimeout(() => star.classList.remove('active'), 1450);
              nextShootingStarAt = performance.now() + 18000 + Math.random() * 30000;
            }
          } else nextShootingStarAt = Infinity;
        }
      }

      async function unlockAudio() {
        try {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (!AudioContextClass) return;
          if (!audioContext) audioContext = new AudioContextClass();
          if (audioContext.state === 'suspended') await audioContext.resume();
        } catch (_) { /* The visual timer works even if audio is unavailable. */ }
      }

      function playChime() {
        if (!audioContext || audioContext.state !== 'running') return;
        try {
          const now = audioContext.currentTime;
          const master = audioContext.createGain();
          master.gain.value = .15;
          master.connect(audioContext.destination);
          const notes = [
            { frequency: 523.25, start: 0, level: .6, type: 'sine' },
            { frequency: 659.25, start: .13, level: .45, type: 'sine' },
            { frequency: 783.99, start: .27, level: .34, type: 'triangle' },
            { frequency: 1046.5, start: .42, level: .19, type: 'sine' }
          ];
          notes.forEach(({ frequency, start, level, type }) => {
            const oscillator = audioContext.createOscillator();
            const gain = audioContext.createGain();
            const startTime = now + start;
            oscillator.type = type;
            oscillator.frequency.value = frequency;
            gain.gain.setValueAtTime(.0001, startTime);
            gain.gain.exponentialRampToValueAtTime(level, startTime + .035);
            gain.gain.exponentialRampToValueAtTime(.0001, now + 2.5);
            oscillator.connect(gain);
            gain.connect(master);
            oscillator.start(startTime);
            oscillator.stop(now + 2.52);
            oscillator.onended = () => { oscillator.disconnect(); gain.disconnect(); };
          });
          setTimeout(() => master.disconnect(), 2700);
        } catch (_) { /* Audio failure must not interrupt the timer. */ }
      }

      function start() {
        if (running) return;
        if (remainingMs <= 0) remainingMs = durationMs;
        if (remainingMs <= 0) {
          announcement.textContent = 'Set a time above zero to start.';
          minutesInput.focus();
          return;
        }
        completed = false;
        running = true;
        deadline = performance.now() + remainingMs;
        tickInterval = setInterval(tick, 80);
        updateControls();
        showControls();
        announcement.textContent = 'Timer started.';
        void unlockAudio();
      }

      function pause() {
        if (!running) return;
        remainingMs = Math.max(0, deadline - performance.now());
        if (remainingMs === 0) { finish(); return; }
        stopClock();
        renderTime();
        updateControls();
        announcement.textContent = 'Timer paused.';
      }

      function reset() {
        stopClock();
        completed = false;
        nextShootingStarAt = Infinity;
        remainingMs = durationMs;
        renderTime();
        updateControls();
        announcement.textContent = 'Timer reset.';
      }

      function commitDuration() {
        if (!editingChanged) { renderTime(); return; }
        const minutes = clamp(parseInt(minutesInput.value.replace(/\D/g, ''), 10) || 0, 0, 99);
        const seconds = clamp(parseInt(secondsInput.value.replace(/\D/g, ''), 10) || 0, 0, 59);
        durationMs = (minutes * 60 + seconds) * 1000;
        remainingMs = durationMs;
        completed = false;
        editingChanged = false;
        renderTime();
        updateControls();
      }

      function handleFieldInput(event) {
        if (running) stopClock();
        const field = event.currentTarget;
        const digits = field.value.replace(/\D/g, '').slice(0, 2);
        if (field.value !== digits) field.value = digits;
        editingChanged = true;
        completed = false;
        updateControls();
      }

      [minutesInput, secondsInput].forEach((field) => {
        field.addEventListener('focus', () => { if (running) pause(); editingChanged = false; field.select(); showControls(); });
        field.addEventListener('input', handleFieldInput);
        field.addEventListener('blur', commitDuration);
        field.addEventListener('keydown', (event) => {
          if (event.key === 'Enter') { event.preventDefault(); field.blur(); playButton.focus(); }
          if (event.key === 'ArrowUp' || event.key === 'ArrowDown') {
            event.preventDefault();
            const max = field === minutesInput ? 99 : 59;
            const delta = event.key === 'ArrowUp' ? 1 : -1;
            field.value = String(clamp((parseInt(field.value, 10) || 0) + delta, 0, max)).padStart(2, '0');
            editingChanged = true;
            commitDuration();
            field.select();
          }
        });
      });

      playButton.addEventListener('click', () => running ? pause() : start());
      resetButton.addEventListener('click', reset);

      fullscreenButton.addEventListener('click', async () => {
        try {
          if (document.fullscreenElement) await document.exitFullscreen();
          else if (document.documentElement.requestFullscreen) await document.documentElement.requestFullscreen();
        } catch (_) { announcement.textContent = 'Fullscreen is unavailable in this browser.'; }
        showControls();
      });
      document.addEventListener('fullscreenchange', () => {
        const expanded = Boolean(document.fullscreenElement);
        $('expand-icon').toggleAttribute('hidden', expanded);
        $('compress-icon').toggleAttribute('hidden', !expanded);
        fullscreenButton.setAttribute('aria-label', expanded ? 'Exit fullscreen' : 'Enter fullscreen');
        fullscreenButton.title = expanded ? 'Exit fullscreen' : 'Toggle fullscreen';
      });

      app.addEventListener('pointermove', showControls);
      app.addEventListener('pointerdown', showControls);
      app.addEventListener('touchstart', showControls, { passive: true });
      document.addEventListener('visibilitychange', () => { if (!document.hidden) tick(); });
      document.addEventListener('keydown', (event) => {
        if (event.target instanceof HTMLInputElement) return;
        if (event.code === 'Space') { event.preventDefault(); running ? pause() : start(); }
        else if (event.key.toLowerCase() === 'r' && !event.repeat) reset();
        showControls();
      });

      // Fixed seed keeps the decorative stars stable across reloads and screen sizes.
      const starGroup = $('stars');
      let seed = 15711;
      const random = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
      for (let i = 0; i < 132; i++) {
        const star = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        star.setAttribute('cx', (40 + random() * 1360).toFixed(1));
        star.setAttribute('cy', (30 + random() * 405).toFixed(1));
        star.setAttribute('r', (.55 + random() * 1.15).toFixed(2));
        star.setAttribute('fill', '#fff7e6');
        star.setAttribute('class', 'star');
        star.style.setProperty('--twinkle', `${(2.4 + random() * 3.8).toFixed(1)}s`);
        star.style.setProperty('--delay', `${(-random() * 5).toFixed(1)}s`);
        starGroup.appendChild(star);
      }

      // Dense, seeded SVG population: 168 dwellings, each retaining two illuminated windows.
      const denseCity = $('dense-city');
      const houseTypes = ['#house', '#houseTall', '#houseCourt'];
      for (let row = 0; row < 6; row++) {
        for (let column = 0; column < 28; column++) {
          const dwelling = document.createElementNS('http://www.w3.org/2000/svg', 'use');
          const x = -8 + column * 52 + (row % 2) * 21 + (random() - .5) * 12;
          const slope = 14 * Math.sin((x / 1440) * Math.PI * 2.4);
          const y = 458 + row * 24 + slope + (random() - .5) * 8;
          const scale = .46 + random() * .19;
          dwelling.setAttribute('href', houseTypes[Math.floor(random() * houseTypes.length)]);
          dwelling.setAttribute('transform', `translate(${x.toFixed(1)} ${y.toFixed(1)}) scale(${scale.toFixed(3)})`);
          denseCity.appendChild(dwelling);
        }
      }

      renderTime();
      updateControls();
    })();
  </script>
</body>
</html>
